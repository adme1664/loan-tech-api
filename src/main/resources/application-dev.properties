spring.application.name=loan-tech-api
server.port=9091

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=commercialloan
spring.jpa.database=postgresql
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=commercialloan
spring.flyway.createSchemas=true
spring.flyway.baselineOnMigrate=true
spring.flyway.baselineVersion=0
spring.flyway.outOfOrder=false

# OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.writer-with-default-pretty-printer=true

# Actuator Configuration (for Prometheus metrics)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# Logging Configuration
logging.level.com.adme.learning.loan.tech.api=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


